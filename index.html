<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veil · 色层之湖</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="base"></canvas>
<canvas id="scene"></canvas>

<div id="overlay">
  <div class="card">
    <div class="en">VEIL · LAKE OF COLOR</div>
    <h1>色层之湖</h1>
    <p class="sub">Let your hands speak.<br>The pigment will fall.</p>
    <div class="gestures">
      <div class="row"><span class="g">✌️</span><span class="lbl">比耶</span><span class="arr">→</span><span class="desc">色层自上垂落</span></div>
      <div class="row"><span class="g">☝️</span><span class="lbl">轻点</span><span class="arr">→</span><span class="desc">水面涟漪散开</span></div>
      <div class="row"><span class="g">🤟</span><span class="lbl">我爱你</span><span class="arr">→</span><span class="desc">墨笔作画，淡去</span></div>
      <div class="row"><span class="g">✊</span><span class="lbl">握拳</span><span class="arr">→</span><span class="desc">清空画面</span></div>
    </div>
    <p class="tip">需要开启摄像头，请允许浏览器授权。</p>
    <button id="enter">Enter quietly →</button>
  </div>
</div>

<div id="hint"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>
<script src="sketch.js"></script>
</body>
</html>
